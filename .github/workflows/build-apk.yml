name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk misi-pencoblosan.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" misi-pencoblosan.apk \
            --title "Misi Pencoblosan (build ${{ github.run_number }})" \
            --notes "APK uji coba (debug). Unduh misi-pencoblosan.apk lalu pasang di HP Android 7.0 ke atas. Izinkan 'Instal aplikasi tidak dikenal' bila diminta." \
            --latest
