name: Terbitkan Website

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Susun situs (game + alat bingkai)
        run: |
          mkdir -p _site/bingkai
          cp -r app/src/main/assets/. _site/
          cp -r bingkai/. _site/bingkai/
          # Paket ekstensi Chrome/Edge selalu sama dengan isi folder bingkai/
          mkdir -p /tmp/ext
          cp -r bingkai/. /tmp/ext/
          cp -r bingkai-ekstensi/. /tmp/ext/
          (cd /tmp/ext && zip -qr "$GITHUB_WORKSPACE/_site/bingkai/bingkai-dokumentasi-ekstensi.zip" .)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
