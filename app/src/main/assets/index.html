<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e0606">
<title>Misi Pencoblosan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: petualangan RPG ramah dan edukatif, netral terhadap peserta pemilu
   IDEA: konsol genggam landscape bertema KPU; berjalan bebas, bertarung melawan Money Politik dan Hoax
   PICTURE: peta pixel kampung tepian sungai, TPS sesuai denah, arena pertarungan bergaya RPG klasik
   COLOUR and TYPE: marun KPU, emas untuk aksi, krem untuk teks; Pixelify Sans + Inter
   LAYOUT: layar penuh landscape; HUD di sudut atas, joystick kiri bawah, tombol A/B kanan bawah */
:root{color-scheme:dark;--m900:#2e0606;--m800:#4A0A0A;--m600:#771414;--gold:#FFB20E;--pale:#E9CD8A;--red:#BE3329;--ink:#FEFAF3;--muted:#e9d6c8;--px:"Pixelify Sans",ui-monospace,monospace;--sans:Inter,"Helvetica Neue",Arial,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#140202;color:var(--ink);font:16px/1.5 var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.app{position:fixed;inset:0;overflow:hidden;background:#140202}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s;z-index:3}.fade.on{opacity:1}
.fade.white{background:#fff}
/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));pointer-events:none;z-index:2}
.prof{pointer-events:auto;background:#2e0606e6;border:3px solid #000;border-radius:8px;padding:5px 10px 6px;min-width:170px}
.prof .n{font:700 14px var(--px);color:var(--pale);display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.prof .n b{color:var(--gold)}
.hearts{font:700 15px var(--px);color:#ff4d5e;letter-spacing:1px}
.xpb{height:7px;background:#140202;border:2px solid #000;margin-top:3px}.xpb i{display:block;height:100%;background:#6fd3ff;width:0;transition:width .3s}
.obj{flex:1;text-align:center;align-self:center;font:700 13px/1.3 var(--sans);color:var(--ink);text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000;padding:0 6px}
.obj b{font-family:var(--px);color:var(--gold);margin-right:4px}
.tr{display:flex;gap:6px;align-items:center;pointer-events:auto}
.pts{font:700 16px var(--px);color:var(--gold);background:#2e0606e6;border:3px solid #000;border-radius:8px;padding:4px 10px;white-space:nowrap}
.hbtn{all:unset;cursor:pointer;height:36px;min-width:36px;padding:0 10px;display:grid;place-items:center;border:3px solid #000;background:var(--m600);border-radius:8px;font:700 13px var(--px);color:var(--ink)}
.hbtn:focus-visible{outline:2px solid var(--ink)}
/* controls */
.joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:#0006;border:3px solid #fff3;z-index:2;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#222);border:3px solid #000;box-shadow:0 3px 0 #000}
.abtns{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;z-index:2}
.abtns button{all:unset;cursor:pointer;display:grid;place-items:center;border-radius:50%;border:3px solid #000;font:700 22px/1 var(--px);color:var(--m800);touch-action:none}
.abtns .a{width:72px;height:72px;background:var(--gold);box-shadow:0 5px 0 #8a5a00,0 5px 0 3px #000;margin-bottom:26px}
.abtns .b{width:56px;height:56px;background:var(--pale);box-shadow:0 4px 0 #9b8450,0 4px 0 3px #000;font-size:18px}
.abtns button:active{transform:translateY(4px)}
.abtns span{font-size:9px;display:block;margin-top:2px}
@media(hover:hover) and (pointer:fine){.joy{opacity:.55}}
/* toast & dialog */
.toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-120px);background:var(--gold);color:var(--m800);font:700 15px var(--px);padding:6px 14px;border:3px solid #000;border-radius:6px;transition:transform .25s;white-space:nowrap;z-index:9;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.dlg{position:absolute;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 330px));min-width:min(460px,96%);bottom:max(10px,env(safe-area-inset-bottom));display:none;z-index:6}.dlg.show{display:block}
@media(max-width:700px){.dlg{width:96%}}
.dlg .box{position:relative;background:#fefaf3;color:#1f0a0a;border:4px solid #000;border-radius:8px;box-shadow:0 0 0 3px var(--m600),0 6px 0 3px #000;padding:10px 14px 12px;min-height:84px;cursor:pointer}
.nm{display:inline-block;font:700 13px var(--px);color:var(--ink);background:var(--m600);border:2px solid #000;border-radius:4px;padding:1px 8px;margin:-24px 0 4px}
.dlg p{margin:0;font:600 15px/1.45 var(--sans);min-height:42px}
.more{position:absolute;right:12px;bottom:6px;font:700 14px var(--px);color:var(--m600);animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ch:empty{display:none}
.opt{all:unset;cursor:pointer;flex:1 1 200px;min-height:40px;padding:7px 12px 7px 26px;position:relative;border:3px solid #000;border-radius:6px;background:#f3e6cc;font:700 14px/1.3 var(--sans);color:#1f0a0a}
.opt.on{background:var(--pale)}.opt.on::before{content:"▶";position:absolute;left:8px;font-size:11px;top:50%;transform:translateY(-50%);color:var(--m600)}
/* overlays */
.ov,.mg{position:absolute;inset:0;z-index:8;display:none;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));background:repeating-linear-gradient(0deg,#4A0A0A 0 6px,#520b0b 6px 12px)}
.ov.show,.mg.show{display:block}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:var(--px);margin:0;line-height:1.05;text-wrap:balance;color:var(--pale);text-shadow:2px 2px 0 #000}
h1{font-size:44px;text-align:center}h2{font-size:24px}
.pill{align-self:flex-start;background:var(--red);color:var(--ink);font:700 13px var(--px);padding:3px 12px;border-radius:99px;border:2px solid #000}
.task{margin:0;color:var(--muted);font-size:15px}.note{margin:0;color:var(--muted);font-size:13px}.center{text-align:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:48px;padding:11px 18px;text-align:center;font:700 18px var(--px);color:var(--m800);background:var(--gold);border:3px solid #000;border-radius:6px;box-shadow:0 5px 0 #8a5a00,0 5px 0 3px #000}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5a00,0 1px 0 3px #000}
.btn.ghost{background:var(--m600);color:var(--ink);box-shadow:0 5px 0 #2e0606,0 5px 0 3px #000}
.btn:disabled{opacity:.45;pointer-events:none}.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fef6e4;color:#2a0a0a;border:3px solid #000;border-radius:6px;padding:8px;box-shadow:0 4px 0 #000;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:700 14px/1.2 var(--sans)}
.tile.on{background:var(--pale);outline:4px solid var(--gold);outline-offset:-7px}.tile.good{background:#d7f3dc}.tile.bad{background:#ffd9d4}
.tile img{image-rendering:pixelated}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:#fefaf3;color:#1f0a0a;border:3px solid #000;border-radius:6px;padding:12px 14px;box-shadow:0 4px 0 #000}
.card .hd{font:800 12px var(--sans);color:var(--m600);border-bottom:2px solid var(--m600);padding-bottom:4px;margin-bottom:6px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:14px}.card dt{color:#6b4a3a}.card dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.card .big{font:700 30px var(--px);color:var(--m600)}
.list{display:flex;flex-direction:column;gap:4px;font-size:14px}.list div{display:flex;gap:8px;align-items:baseline}.list b{font-family:var(--px);width:18px;flex:none;color:var(--gold)}.list em{margin-left:auto;font-style:normal;font-family:var(--px);color:var(--pale);white-space:nowrap}
.card .list b{color:var(--m600)}.card .list em{color:var(--m600)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick .tile img{height:150px}
input.name{all:unset;box-sizing:border-box;width:100%;min-height:50px;padding:10px 14px;background:#fefaf3;color:#1f0a0a;border:3px solid #000;border-radius:6px;font:700 18px var(--px)}
input.name:focus{outline:3px solid var(--gold)}
/* ballot & minigames */
.ballot{position:relative;background:#d9d9d9;border:3px solid #000;border-radius:4px;aspect-ratio:1.25;overflow:hidden;color:#111;touch-action:manipulation;max-width:520px;width:100%;margin:0 auto}
.ballot .hd{position:absolute;inset:0 0 auto;height:16%;display:grid;place-items:center;font:800 clamp(8px,1.6vw,12px)/1.1 var(--sans);text-align:center;padding:0 6px;background:#bdbdbd;border-bottom:2px solid #000}
.ballot .col{position:absolute;top:19%;bottom:4%;border:2px solid #000;background:#efefef;display:flex;flex-direction:column;align-items:center;padding:4%;gap:3%}
.ballot .col b{font:700 clamp(14px,3vw,22px) var(--px)}
.ballot .col img{width:70%;image-rendering:pixelated;border:2px solid #000;background:#d8c39a}
.ballot .col span{font:700 clamp(8px,1.6vw,11px)/1.15 var(--sans);text-align:center}
.hole{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:#111;box-shadow:0 0 0 2px #fff8,inset 2px 2px 0 #555;pointer-events:none}
.tear{position:absolute;right:0;top:0;width:28%;height:38%;background:#4A0A0A;clip-path:polygon(100% 0,0 0,30% 20%,10% 40%,45% 55%,30% 75%,100% 100%)}
.ttd{position:absolute;right:6%;bottom:6%;font:italic 700 12px var(--sans);color:#1f3fa8;transform:rotate(-8deg)}
.mg .ballot{max-width:min(520px,calc((100dvh - 190px)*1.25))}.minis .ballot{max-width:none}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:560px;width:100%;margin:0 auto}
.kotak{all:unset;cursor:pointer;position:relative;aspect-ratio:.9;border:3px solid #000;border-radius:4px;background:linear-gradient(#ffffff55,#ffffff22);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
.kotak::before{content:"";position:absolute;top:-3px;left:-3px;right:-3px;height:22%;background:var(--c);border:3px solid #000}
.kotak::after{content:"";position:absolute;top:8%;left:30%;right:30%;height:4px;background:#000}
.kotak small{font:700 9px/1.1 var(--sans);text-align:center;color:#000;background:var(--c);padding:2px 3px;border:2px solid #000}
.kotak .cnt{position:absolute;top:34%;font:700 16px var(--px);color:#fff;text-shadow:1px 1px 0 #000}
.tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:70px}
.ss{all:unset;cursor:pointer;width:62px;height:64px;background:var(--c);border:3px solid #000;border-radius:3px;display:grid;place-items:center;font:700 9px/1.1 var(--sans);text-align:center;color:#000;box-shadow:0 4px 0 #000;transition:transform .15s}
.ss.on{transform:translateY(-10px) rotate(-4deg);outline:3px solid var(--ink)}
.tintabox{display:flex;gap:24px;align-items:flex-end;justify-content:center}
.meter{position:relative;height:140px;width:90px;border:3px solid #000;background:#fef6e4;border-radius:0 0 30px 30px;margin-top:100px}
.meter .zone{position:absolute;left:0;right:0;background:#3fae5a55;border-block:2px dashed #2b7a3f}
.meter .ink{position:absolute;left:0;right:0;bottom:0;background:#5b2a86;border-radius:0 0 26px 26px}
.finger{position:absolute;left:50%;width:34px;margin-left:-17px;bottom:100%;height:100px;background:#e0a878;border:3px solid #000;border-radius:16px 16px 0 0}
.fb{font:700 14px var(--sans);padding:8px 10px;border:3px solid #000;border-radius:6px;background:#fef6e4;color:#2a0a0a}.fb.no{background:#ffd9d4}.fb.ok{background:#d7f3dc}
.stars{font:700 44px var(--px);color:var(--gold);text-align:center;text-shadow:3px 3px 0 #000;letter-spacing:6px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* battle */
.bt{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;background:#000}.bt.show{display:flex}
.arena{position:relative;flex:1;overflow:hidden;background:linear-gradient(#f6c66b 0,#f3a35b 38%,#7fbf5a 38.2%,#5fa847 100%)}
.arena::before{content:"";position:absolute;left:0;right:0;top:30%;height:9%;background:repeating-linear-gradient(90deg,#2f7d32 0 26px,#3c8f3c 26px 44px);clip-path:polygon(0 100%,0 40%,4% 10%,8% 45%,13% 0,18% 40%,24% 15%,30% 50%,36% 5%,42% 45%,49% 20%,55% 50%,61% 0,67% 40%,73% 12%,80% 48%,86% 8%,92% 42%,100% 20%,100% 100%)}
.plat{position:absolute;border-radius:50%;background:radial-gradient(#9bd27a,#4f9a3a 70%);border:3px solid #2e5e22}
.spr{position:absolute;image-rendering:pixelated;transform-origin:50% 100%}
.spr.idle{animation:idle 1.2s steps(2) infinite}@keyframes idle{50%{transform:translateY(-3px)}}
.panel{position:absolute;background:#fefaf3;color:#1f0a0a;border:3px solid #000;border-radius:8px;box-shadow:0 4px 0 #000;padding:6px 10px 8px;width:min(300px,38%)}
.panel .t{display:flex;justify-content:space-between;font:700 15px var(--px);gap:8px}.panel .t span{white-space:nowrap}
.bar{height:10px;border:2px solid #000;background:#3a2a2a;margin-top:4px;position:relative;border-radius:3px;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:#3fae5a;transition:width .2s}
.bar.mp i{background:#3b82f6}.bar.atb{height:6px}.bar.atb i{background:var(--gold);transition:none}
.bar small{position:absolute;right:4px;top:-2px;font:700 9px var(--px);color:#fff;text-shadow:1px 1px 0 #000}
.lab{display:flex;justify-content:space-between;font:700 11px var(--sans);color:#6b4a3a;margin-top:3px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:4px;min-height:16px;margin-top:3px;flex-wrap:wrap}.badges span{font:700 10px var(--px);padding:0 5px;border:2px solid #000;border-radius:3px;color:#000}
.bS{background:#ffd23f}.bP{background:#b98ae0}.bI{background:#bdbdbd}
.skills{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:8px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:var(--m900);border-top:3px solid #000}
.sk{all:unset;cursor:pointer;position:relative;overflow:hidden;min-height:56px;display:flex;align-items:center;gap:8px;padding:4px 8px;background:#fefaf3;color:#1f0a0a;border:3px solid #000;border-radius:8px;box-shadow:0 4px 0 #000}
.sk img{width:32px;height:32px;image-rendering:pixelated;flex:none;background:#4A0A0A;border:2px solid #000;border-radius:4px}
.sk b{display:block;font:700 13px/1.1 var(--px)}.sk small{font:700 11px var(--sans);color:#3b6fd6}
.sk.ult{background:var(--pale)}.sk.run{background:#cfc4ab;justify-content:center}
.sk .cd{position:absolute;inset:0;background:#000a;display:none;place-items:center;font:700 20px var(--px);color:#fff}
.sk.wait .cd{display:grid}.sk.nomp{opacity:.55}
.sk:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.blog{position:absolute;left:50%;top:44%;transform:translateX(-50%);font:700 15px var(--px);color:#fff;text-shadow:2px 2px 0 #000;white-space:nowrap;pointer-events:none}
.dmg{position:absolute;font:700 22px var(--px);color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;pointer-events:none;z-index:3}
.proj{position:absolute;image-rendering:pixelated;pointer-events:none;z-index:2}
.bubble{position:absolute;background:#fff;color:#000;border:3px solid #000;border-radius:10px;padding:4px 10px;font:700 13px var(--sans);z-index:3;white-space:nowrap}
.res{position:absolute;inset:0;background:#000a;display:none;place-items:center;z-index:5;padding:16px}.res.show{display:grid}
.res .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.hint{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 140px);z-index:4;background:var(--gold);color:var(--m800);font:700 14px var(--px);padding:6px 12px;border:3px solid #000;border-radius:8px;display:none;max-width:240px;animation:bob .8s steps(2) infinite}.hint.show{display:block}
.hint.r{left:auto;right:max(18px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 110px)}
.tut{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--gold);color:var(--m800);border:3px solid #000;border-radius:8px;padding:6px 14px;font:700 14px/1.3 var(--sans);max-width:min(440px,60%);text-align:center;z-index:4;display:none}.tut.show{display:block}
.sk.pulse{outline:4px solid var(--gold);outline-offset:2px;animation:pul .6s steps(2) infinite}@keyframes pul{50%{outline-color:#fff}}
.shield{position:absolute;border-radius:50%;border:5px solid #6fd3ffcc;background:radial-gradient(#6fd3ff00 55%,#6fd3ff55);pointer-events:none;display:none;animation:shp 1.4s ease-in-out infinite}.shield.show{display:block}@keyframes shp{50%{transform:scale(1.04)}}
.argm{position:absolute;inset:0;background:#000b;z-index:6;display:none;place-items:center;padding:12px}.argm.show{display:grid}
.argm .card{max-width:620px;width:100%;display:flex;flex-direction:column;gap:8px}
.argm q{font:700 18px/1.3 var(--px);color:#771414;quotes:"\201C" "\201D"}
.argm .opt{flex:none}
.argm .bar i{background:var(--gold)}
.share{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px;align-items:start}
.share img{width:100%;border:3px solid #000;border-radius:6px;box-shadow:0 4px 0 #000}
@media(max-width:560px){.share{grid-template-columns:1fr}}
.badgel{display:flex;flex-wrap:wrap;gap:6px}.badgel span{font:700 12px var(--px);background:var(--pale);color:var(--m800);border:2px solid #000;border-radius:4px;padding:2px 8px}
.gray{filter:grayscale(1) brightness(1.1)}
.rot{position:fixed;inset:0;z-index:20;background:#2e0606;display:none;place-items:center;text-align:center;padding:30px}
.rot div{font:700 22px var(--px);color:var(--pale)}.rot .ph{width:60px;height:96px;border:4px solid var(--pale);border-radius:10px;margin:0 auto 18px;animation:rot 1.6s infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse) and (max-width:599px){.rot{display:grid}}
.kbd{display:none}@media(hover:hover) and (pointer:fine){.kbd{display:block}}
@media(max-height:380px){.joy{width:110px;height:110px}.abtns .a{width:62px;height:62px}.abtns .b{width:50px;height:50px}.sk{min-height:48px}.sk img{width:26px;height:26px}h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv"></canvas>
  <div class="fade" id="fade"></div>
  <div class="hud">
    <div class="prof"><div class="n"><span id="pname">Pemilih</span><b id="plv">Lv 1</b><span class="hearts" id="hearts">♥♥♥</span></div><div class="xpb"><i id="pxp"></i></div></div>
    <div class="obj" id="obj"></div>
    <div class="tr"><span class="pts" id="pts">★ 0</span><button class="hbtn" id="misBtn">MISI</button><button class="hbtn" id="mute" aria-label="Suara">♪</button></div>

function bfsPath(m,sx,sy,tx,ty,avoid){const W=m.t[0].length,q=[[sx,sy]],prev={};prev[sx+','+sy]=null;const ok=(x,y)=>{const c=m.t[y]&&m.t[y][x];return c&&!m.solid.has(c)&&!avoid.has(x+','+y)};
 while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(k in prev||!(ok(nx,ny)||(nx===tx&&ny===ty)))continue;prev[k]=x+','+y;q.push([nx,ny])}}
 const out=[];let c=tx+','+ty;if(!(c in prev))return [];while(c){out.unshift(c.split(',').map(Number));c=prev[c]}return out}

 const ot=objTile();if(ot){const b=Math.round(Math.sin(T/180)*2),X=ot[0]*TS+ox,Y=ot[1]*TS+oy-9+b;R(X+4,Y-1,8,3,OL);R(X+5,Y+2,6,2,OL);R(X+6,Y+4,4,2,OL);R(X+7,Y+6,2,1,OL);R(X+5,Y,6,2,'#FFB20E');R(X+6,Y+2,4,2,'#FFB20E');R(X+7,Y+4,2,2,'#FFB20E')}
 const ents=map.npcs.filter(n=>!n.gone).map(n=>({y:n.y*TS+13,f:()=>person(n.x*TS+ox,n.y*TS+oy-3+(n.sit?2:0),n.dir,0,n.L,n.sit)}));
 const step=P.moving?Math.floor(P.dist/6)%2+1:0;ents.push({y:P.fy,f:()=>person(px+ox,py+oy,P.dir,step,S.female?LOOK.meF:LOOK.me)});ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
 if(P.bang){const X=Math.round(px+ox)+4,Y=Math.round(py+oy)-14;R(X-1,Y-1,10,12,OL);R(X,Y,8,10,'#fff');R(X+3,Y+1,2,5,'#e2453a');R(X+3,Y+7,2,2,'#e2453a')}}
let lastT=0;
let saveT=0;
function hints(){const h=$('hint');let t='',right=false;if(started&&S&&!lock&&!$('ov').classList.contains('show')){const fine=matchMedia('(pointer:fine)').matches;
 if(S.tut===0){t=fine?'Tekan panah/WASD untuk berjalan':'Geser joystick untuk berjalan';if(P.dist>50)S.tut=1}
 else if(S.tut===1&&map.id==='home'&&!S.m.lemari){t=fine?'Hadap lemari (panah emas), lalu tekan Z/Enter':'Hadap lemari (panah emas), lalu tekan A';right=!fine}
 else if(S.tut===1&&S.m.lemari)S.tut=2}
 h.textContent=t;h.classList.toggle('show',!!t);h.classList.toggle('r',right)}
function loop(ts){const dt=Math.min(.05,(ts-(lastT||ts))/1000);lastT=ts;T=ts;if(S&&started&&!$('ov').classList.contains('show'))S.play+=dt;if(ts-saveT>3000){saveT=ts;save()}hints();if(S&&map){if(!$('bt').classList.contains('show'))updateMove(dt);draw()}requestAnimationFrame(loop)}
/* ---------- input ---------- */
function pressA(){if(D.res){advance();return}if($('ov').classList.contains('show')||$('mg').classList.contains('show')||$('bt').classList.contains('show')||!started)return;if(!lock)interact()}
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
function optMove(d){if(!(D.res&&D.opts))return false;D.sel=(D.sel+d+D.opts.length)%D.opts.length;if(!D.timer)drawOpts();return true}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if($('bt').classList.contains('show')&&B){const h=HSK.find(q=>q.key===e.key);if(h){heroAct(h);e.preventDefault()}return}
 if(D.res&&D.opts&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){optMove(e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:1);e.preventDefault();return}
 if(KM[e.key]){keys[KM[e.key]]=true;e.preventDefault()}else if(['z','Z','Enter',' '].includes(e.key)){if(!e.repeat)pressA();e.preventDefault()}else if(['x','X','Escape'].includes(e.key)){$('ov').classList.contains('show')&&started&&!lock?closeOv():journal()}});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=false});
addEventListener('blur',()=>{keys={}});
const joy=$('joy'),knob=$('knob');let jid=null,lastFlick=0;
function joyMove(e){const r=joy.getBoundingClientRect(),R0=r.width/2-10;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const l=Math.hypot(dx,dy);if(l>R0){dx*=R0/l;dy*=R0/l}knob.style.transform=`translate(${dx}px,${dy}px)`;joyV={x:dx/R0,y:dy/R0};
 if(D.res&&D.opts&&Math.abs(joyV.y)>.6&&performance.now()-lastFlick>350){lastFlick=performance.now();optMove(joyV.y>0?1:-1)}}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(v=>joy.addEventListener(v,e=>{if(e.pointerId!==jid)return;jid=null;knob.style.transform='';joyV={x:0,y:0}}));
$('aBtn').addEventListener('pointerdown',e=>{e.preventDefault();pressA()});
$('bBtn').addEventListener('pointerdown',e=>{e.preventDefault();journal()});
$('misBtn').onclick=journal;
$('mute').onclick=()=>{muted=!muted;$('mute').style.opacity=muted?.4:1;if(!muted)sfx.tap()};
reset();fit();title();requestAnimationFrame(loop);
window.__g={end:()=>endScreen(),args:()=>ARGS,m:()=>map,S:()=>S,P:()=>P,map:()=>map.id,lock:()=>lock,dlg:()=>!!D.res,B:()=>B,keys:k=>{keys=k||{}}};
}
